[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ber"
version = "0.1.0"
description = "Calibrated Precision-First Cascade (CPFC) for Business Entity Resolution"
readme = "README.md"
authors = [{ name = "Amazon ML Challenge Team" }]
dependencies = [
    "lightgbm>=4.0.0",
    "xgboost>=2.0.0",
    "scikit-learn>=1.3.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "rapidfuzz>=3.0.0",
    "pyyaml>=6.0",
    "pyarrow>=14.0.0",
    "pytest>=7.4.0",
    "tqdm>=4.66.0",
]

[project.scripts]
ber = "ber.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
